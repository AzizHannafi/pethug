# Datasource for the integration tests. The keys are the ones MysqlConfig reads.
jdbc.driverClassName=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/petsdbtest?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&serverTimezone=UTC
jdbc.username=root
jdbc.password=root

# MySQL5InnoDBDialect was removed in Hibernate 6 (Spring Boot 3).
hibernate.dialect=org.hibernate.dialect.MySQLDialect
hibernate.show_sql=true
# Hibernate ddl auto (create, create-drop, validate, update)
hibernate.hbm2ddl.auto=update

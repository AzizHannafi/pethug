server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Base64 images are posted inline by the create forms.
    client_max_body_size 20m;

    # Docker's embedded DNS, so nginx starts even when the backend is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Reverse proxy to the Spring Boot API: the browser only ever talks to
    # this origin, so there is no CORS involved at all.
    location /api/ {
        set $upstream http://backend:8086;
        proxy_pass $upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The LLM can take a while to answer.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # Runtime configuration must never be cached.
    location = /config.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Angular router: every unknown path falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

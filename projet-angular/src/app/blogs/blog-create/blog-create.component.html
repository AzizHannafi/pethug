<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">
          {{ isEditing ? 'Edit Blog Post' : 'Create New Blog Post' }}
        </h1>
        <p class="text-gray-600">{{ isEditing ? 'Update blog post content' : 'Share your knowledge about pet care' }}</p>
      </div>

      <form (ngSubmit)="onSubmit()" #blogForm="ngForm" class="card p-8">
        <!-- Title -->
        <div class="mb-6">
          <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title</label>
          <input
            id="title"
            name="title"
            type="text"
            required
            [(ngModel)]="blogPost.title"
            class="input-field"
            placeholder="Enter blog post title"
          />
        </div>

        <!-- Content -->
        <div class="mb-6">
          <label for="content" class="block text-sm font-medium text-gray-700 mb-1">Content</label>
          <textarea
            id="content"
            name="content"
            required
            rows="12"
            [(ngModel)]="blogPost.content"
            class="input-field"
            placeholder="Write your blog post content here..."
          ></textarea>
        </div>

        <!-- Author and Image -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
         <div>
            <div class="space-y-3">
              <div class="flex items-center justify-center w-full">
                <label for="imageFile" class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
                  <div class="flex flex-col items-center justify-center pt-5 pb-6">
                    <svg class="w-8 h-8 mb-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p class="mb-2 text-sm text-gray-500">
                      <span class="font-semibold">Click to upload</span> or drag and drop
                    </p>
                    <p class="text-xs text-gray-500">PNG, JPG, GIF up to 10MB</p>
                  </div>
                  <input
                    id="imageFile"
                    name="imageFile"
                    type="file"
                    accept="image/*"
                    (change)="onImageFileSelected($event)"
                    class="hidden"
                  />
                </label>
              </div>
              <div *ngIf="isUploadingImage" class="text-center">
                <div class="inline-flex items-center px-4 py-2 text-sm text-blue-600">
                  <svg class="animate-spin -ml-1 mr-3 h-4 w-4 text-blue-600" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                  </svg>
                  Uploading image...
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Tags -->
        <div class="mb-6">
          <label for="tags" class="block text-sm font-medium text-gray-700 mb-1">Tags</label>
          <input
            id="tags"
            name="tags"
            type="text"
            [(ngModel)]="tagsString"
            class="input-field"
            placeholder="Enter tags separated by commas (e.g., adoption, pets, guide)"
          />
          <p class="text-sm text-gray-500 mt-1">Separate tags with commas</p>
        </div>

        <!-- Image Preview -->
        <div *ngIf="blogPost.imageUrl" class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-2">Image Preview</label>
          <div class="relative inline-block">
              <img [src]="blogPost.imageUrl" [alt]="blogPost.title" class="w-full h-64 object-cover rounded-lg">
                <button
                  type="button"
                  (click)="removeImage()"
                  class="absolute top-2 right-2 bg-red-500 text-white rounded-full p-1 hover:bg-red-600"
                >
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                  </svg>
                </button>
            </div> 
        </div>

        <!-- Form Actions -->
        <div class="flex justify-between items-center pt-6 border-t border-gray-200">
          <a routerLink="/admin/blogs" class="text-gray-600 hover:text-gray-800">
            ← Back to Blog Posts
          </a>
          <div class="space-x-4">
            <button
              type="button"
              (click)="onCancel()"
              class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50"
            >
              Cancel
            </button>
            <button
              type="submit"
              [disabled]="!blogForm.form.valid || isSubmitting"
              class="btn-primary disabled:opacity-50"
            >
              {{ isSubmitting ? 'Saving...' : (isEditing ? 'Update Post' : 'Publish Post') }}
            </button>
          </div>
        </div>
      </form>
    </div>

<!-- Toast stack. Sits above everything, never blocks the page. -->
<div class="fixed top-4 right-4 z-50 flex flex-col gap-3 w-[min(24rem,calc(100vw-2rem))]"
     aria-live="polite">

  @for (n of notifications(); track n.id) {
    <div class="flex items-start gap-3 rounded-xl border p-4 shadow-lg animate-[slideIn_.2s_ease-out]"
         [class]="n.kind === 'success' ? 'bg-emerald-50 border-emerald-200'
                : n.kind === 'denied'  ? 'bg-amber-50 border-amber-200'
                : n.kind === 'error'   ? 'bg-red-50 border-red-200'
                :                        'bg-blue-50 border-blue-200'"
         role="alert">

      <!-- Icon -->
      <div class="shrink-0 mt-0.5"
           [class]="n.kind === 'success' ? 'text-emerald-600'
                  : n.kind === 'denied'  ? 'text-amber-600'
                  : n.kind === 'error'   ? 'text-red-600'
                  :                        'text-blue-600'">

        @switch (n.kind) {
          @case ('success') {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
          }
          @case ('denied') {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 15v2m0-10a5 5 0 015 5v3H7v-3a5 5 0 015-5zM5 20h14a1 1 0 001-1v-4H4v4a1 1 0 001 1z"/>
            </svg>
          }
          @case ('error') {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            </svg>
          }
          @default {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          }
        }
      </div>

      <!-- Text -->
      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold"
           [class]="n.kind === 'success' ? 'text-emerald-900'
                  : n.kind === 'denied'  ? 'text-amber-900'
                  : n.kind === 'error'   ? 'text-red-900'
                  :                        'text-blue-900'">{{ n.title }}</p>
        @if (n.message) {
          <p class="mt-1 text-sm leading-snug"
             [class]="n.kind === 'success' ? 'text-emerald-800'
                    : n.kind === 'denied'  ? 'text-amber-800'
                    : n.kind === 'error'   ? 'text-red-800'
                    :                        'text-blue-800'">{{ n.message }}</p>
        }
      </div>

      <!-- Dismiss -->
      <button type="button"
              (click)="dismiss(n.id)"
              class="shrink-0 text-gray-400 hover:text-gray-600 transition"
              aria-label="Dismiss">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  }
</div>

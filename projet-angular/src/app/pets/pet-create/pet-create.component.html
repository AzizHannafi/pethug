<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">
          {{ isEditing ? 'Edit Pet' : 'Add New Pet' }}
        </h1>
        <p class="text-gray-600">{{ isEditing ? 'Update pet information' : 'Add a new pet for adoption' }}</p>
      </div>

      <form (ngSubmit)="onSubmit()" #petForm="ngForm" class="card p-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Basic Information -->
          <div>
            <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Pet Name</label>
            <input
              id="name"
              name="name"
              type="text"
              required
              [(ngModel)]="pet.name"
              class="input-field"
              placeholder="Enter pet name"
            />
          </div>

          <div>
            <label for="type" class="block text-sm font-medium text-gray-700 mb-1">Type</label>
            <select
              id="type"
              name="type"
              required
              [(ngModel)]="pet.type"
              class="input-field"
            >
              <option value="">Select type</option>
              <option value="dog">Dog</option>
              <option value="cat">Cat</option>
              <option value="bird">Bird</option>
              <option value="rabbit">Rabbit</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div>
            <label for="breed" class="block text-sm font-medium text-gray-700 mb-1">Breed</label>
            <input
              id="breed"
              name="breed"
              type="text"
              required
              [(ngModel)]="pet.breed"
              class="input-field"
              placeholder="Enter breed"
            />
          </div>

          <div>
            <label for="age" class="block text-sm font-medium text-gray-700 mb-1">Age (years)</label>
            <input
              id="age"
              name="age"
              type="number"
              required
              min="0"
              max="30"
              [(ngModel)]="pet.age"
              class="input-field"
              placeholder="Enter age"
            />
          </div>

          <div>
            <label for="size" class="block text-sm font-medium text-gray-700 mb-1">Size</label>
            <select
              id="size"
              name="size"
              required
              [(ngModel)]="pet.size"
              class="input-field"
            >
              <option value="">Select size</option>
              <option value="small">Small</option>
              <option value="medium">Medium</option>
              <option value="large">Large</option>
            </select>
          </div>

          <div>
            <label for="gender" class="block text-sm font-medium text-gray-700 mb-1">Gender</label>
            <select
              id="gender"
              name="gender"
              required
              [(ngModel)]="pet.gender"
              class="input-field"
            >
              <option value="">Select gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>

          <div>
            <label for="color" class="block text-sm font-medium text-gray-700 mb-1">Color</label>
            <input
              id="color"
              name="color"
              type="text"
              required
              [(ngModel)]="pet.color"
              class="input-field"
              placeholder="Enter color"
            />
          </div>

          <div>
            <label for="location" class="block text-sm font-medium text-gray-700 mb-1">Location</label>
            <input
              id="location"
              name="location"
              type="text"
              required
              [(ngModel)]="pet.location"
              class="input-field"
              placeholder="Enter location"
            />
          </div>

          <div>
            <div class="space-y-3">
              <div class="flex items-center justify-center w-full">
                <label for="imageFile" class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
                  <div class="flex flex-col items-center justify-center pt-5 pb-6">
                    <svg class="w-8 h-8 mb-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p class="mb-2 text-sm text-gray-500">
                      <span class="font-semibold">Click to upload</span> or drag and drop
                    </p>
                    <p class="text-xs text-gray-500">PNG, JPG, GIF up to 10MB</p>
                  </div>
                  <input
                    id="imageFile"
                    name="imageFile"
                    type="file"
                    accept="image/*"
                    (change)="onImageFileSelected($event)"
                    class="hidden"
                  />
                </label>
              </div>
              <div *ngIf="isUploadingImage" class="text-center">
                <div class="inline-flex items-center px-4 py-2 text-sm text-blue-600">
                  <svg class="animate-spin -ml-1 mr-3 h-4 w-4 text-blue-600" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                  </svg>
                  Uploading image...
                </div>
              </div>
            </div>
          </div>
        </div>
        <div *ngIf="pet.imageUrl" class="mt-6">
          <label class="block text-sm font-medium text-gray-700 mb-2">Image Preview</label>
          <div class="relative inline-block">
            <img [src]="pet.imageUrl" [alt]="pet.name" class="w-full max-w-md h-64 object-cover rounded-lg">
            <button
              type="button"
              (click)="removeImage()"
              class="absolute top-2 right-2 bg-red-500 text-white rounded-full p-1 hover:bg-red-600"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Description -->
        <div class="mt-6">
          <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
          <textarea
            id="description"
            name="description"
            required
            rows="4"
            [(ngModel)]="pet.description"
            class="input-field"
            placeholder="Enter pet description"
          ></textarea>
        </div>

        <!-- Contact Information -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
          <div>
            <label for="contactEmail" class="block text-sm font-medium text-gray-700 mb-1">Contact Email</label>
            <input
              id="contactEmail"
              name="contactEmail"
              type="email"
              required
              [(ngModel)]="pet.contactEmail"
              class="input-field"
              placeholder="Enter contact email"
            />
          </div>

          <div>
            <label for="contactPhone" class="block text-sm font-medium text-gray-700 mb-1">Contact Phone</label>
            <input
              id="contactPhone"
              name="contactPhone"
              type="tel"
              required
              [(ngModel)]="pet.contactPhone"
              class="input-field"
              placeholder="Enter contact phone"
            />
          </div>
        </div>

        <!-- Checkboxes -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">

          <div class="flex items-center">
            <input
              id="isVaccinated"
              name="isVaccinated"
              type="checkbox"
              [(ngModel)]="pet.isVaccinated"
              class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 rounded"
            />
            <label for="isVaccinated" class="ml-2 block text-sm text-gray-700">Vaccinated</label>
          </div>

        </div>

        <!-- Form Actions -->
        <div class="flex justify-between items-center pt-6 border-t border-gray-200 mt-8">
          <a routerLink="/admin/pets" class="text-gray-600 hover:text-gray-800">
            ← Back to Pets
          </a>
          <div class="space-x-4">
            <button
              type="button"
              (click)="onCancel()"
              class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50"
            >
              Cancel
            </button>
            <button
              type="submit"
              [disabled]="!petForm.form.valid || isSubmitting"
              class="btn-primary disabled:opacity-50"
            >
              {{ isSubmitting ? 'Saving...' : (isEditing ? 'Update Pet' : 'Add Pet') }}
            </button>
          </div>
        </div>
      </form>
    </div>
